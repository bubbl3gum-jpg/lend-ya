name: Verify combined Hustlen
on:
  pull_request:
  push:
    branches: [main, integration/hustlen-mrt-complete]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:55433/postgres
      MRT_TEST_DATABASE_URL: postgresql://postgres@localhost:55433/hustlen_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
          node -e 'const { chromium } = require("@playwright/test"); const p = chromium.executablePath(); require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + p + "\nMRT_BROWSER_PATH=" + p + "\n");'
      - run: npx prisma validate --config prisma7.config.ts
      - run: npx prisma generate --config prisma7.config.ts
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build:verify
      - run: npm run test:migration
      - run: npm run test:admin-migration
      - run: npm run test:integration
      - run: npm run test:rental-api
      - run: npm run test:rental-browser
      - run: npm run test:admin
      - run: npm run test:moderation
      - run: npm run test:mvp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            .test-artifacts/**/screenshots/*
            .test-artifacts/**/*.json
            /tmp/lend-ya-*.log
